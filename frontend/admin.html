<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị | 5GUYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tailwind-config.js"></script>
<style>
.btn{padding:.45rem 1rem;font-size:.85rem;box-shadow:none}.btn:disabled{opacity:.42;cursor:not-allowed!important;pointer-events:none;filter:grayscale(.35)}
.ghost{padding:.4rem .9rem;font-size:.8rem}.ghost:disabled{opacity:.42;cursor:not-allowed!important;pointer-events:none;filter:grayscale(.35)}
.ghost.active-filter{background:var(--btn-bg);border-color:var(--brand-300);color:var(--btn-text);font-weight:700}
.danger{border-color:#7f1d1d;color:#fca5a5}.danger:hover{border-color:#ef4444;color:#fff}
.card{background:var(--bg-container)}
.inp{padding:.45rem .75rem;font-size:.85rem;width:100%}.inp:disabled{opacity:.42;cursor:not-allowed!important;background:var(--bg-shell)!important;color:var(--text-muted)}
.tab{padding:.55rem 1rem;border-radius:.6rem;font-weight:600;font-size:.9rem;color:var(--text-body)}.tab:hover{background:var(--bg-surface)}.tab.on{background:var(--btn-bg);color:var(--btn-text)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.85rem}th{text-align:left;color:var(--text-muted);font-weight:600;padding:.75rem .85rem;border-bottom:1px solid var(--border-subtle);white-space:nowrap}td{padding:.75rem .85rem;border-bottom:1px solid rgb(var(--g5-border-subtle-rgb) / 0.55);vertical-align:top}
.reason-cell{max-width:280px;min-width:180px;white-space:normal!important;word-break:break-word;overflow-wrap:anywhere}
.reason-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:280px;white-space:normal;word-break:break-word;line-height:1.45}
.pill{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;border-radius:9999px;padding:.15rem .65rem;border:1px solid;white-space:nowrap;width:fit-content}
.scroll{overflow-x:auto}
@media print{body *{visibility:hidden}#admin-order-modal,#admin-order-modal *{visibility:visible}#admin-order-modal{position:fixed;inset:0;background:#fff!important;color:#000!important;padding:0!important}#admin-order-modal .no-print{display:none!important}}
</style>
<script>window.G5_REQUIRE_AUTH=true</script>
<link rel="stylesheet" href="assets/shared.css"><script src="assets/shared.js"></script>
</head>
<body class="min-h-screen">
<header class="border-b border-dark-border bg-dark-bg/95 sticky top-0 z-30 backdrop-blur">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
    <a href="index.html" class="text-2xl font-black tracking-widest flex items-center gap-2"><i class="fa-solid fa-gamepad text-brand"></i><span>5</span><span class="text-brand-light">GUYS</span><span class="text-xs font-bold ml-2 px-2 py-0.5 rounded bg-brand/20 text-brand-light tracking-normal">ADMIN</span></a>
    <div class="flex items-center gap-3 text-sm">
      <a href="index.html" class="ghost"><i class="fa-solid fa-store"></i> Về cửa hàng</a>
      <span class="hidden sm:inline text-outline"><i class="fa-solid fa-user-shield"></i> <span data-user-name></span></span>
      <button data-logout class="ghost danger"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="denied" class="hidden card p-8 text-center">
    <i class="fa-solid fa-lock text-4xl text-brand-light"></i>
    <h2 class="text-xl font-bold mt-3">Bạn không có quyền quản trị</h2>
    <p class="text-outline mt-2 text-sm">Tài khoản cần có vai trò <b>admin</b>. Chạy file <code>database/make_admin.sql</code> với email của bạn, rồi đăng xuất và đăng nhập lại.</p>
    <a href="index.html" class="btn mt-4">Về cửa hàng</a>
  </div>

  <div id="app" class="hidden">
    <h1 class="text-3xl font-black uppercase border-l-4 border-brand pl-4">Bảng quản trị</h1>
    <nav id="tabs" class="flex flex-wrap gap-2 mt-6 mb-6"></nav>
    <p id="flash" class="hidden mb-4 text-sm px-4 py-2 rounded-lg"></p>
    <section id="view"></section>
  </div>
</main>

<script>
(function () {
  const money = n => new Intl.NumberFormat('vi-VN').format(Math.round(Number(n) || 0)) + 'đ';
  const date = d => d ? new Date(d).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  // Tao phan tu HTML an toan (dung textContent, khong chen HTML tu du lieu nguoi dung)
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'class') e.className = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return e;
  }
  const view = document.getElementById('view');
  function flash(text, ok = true) {
    const f = document.getElementById('flash');
    f.textContent = text; f.className = 'mb-4 text-sm px-4 py-2 rounded-lg ' + (ok ? 'bg-emerald-900/40 text-emerald-300' : 'bg-red-900/40 text-red-300');
    clearTimeout(flash.t); flash.t = setTimeout(() => f.classList.add('hidden'), 4000);
  }
  async function call(path, method, body) {
    try { return await G5.api('/admin' + path, { method: method || 'GET', body }); }
    catch (err) { flash(G5.errorText(err), false); throw err; }
  }
  const isStrictAdmin = () => (G5.user() || {}).role === 'admin';

  const ORDER_STATUS = {
    pending_payment: ['Chờ thanh toán', '#f59e0b'], paid: ['Chờ lấy hàng', '#60a5fa'], processing: ['Chờ lấy hàng', '#60a5fa'],
    shipped: ['Đang giao', '#c77dff'], fulfilled: ['Đã giao / Hoàn tất', '#10b981'], cancelled: ['Đã hủy', '#9ca3af'],
    refunded: ['Đã hoàn tiền', '#ef4444'], partially_refunded: ['Hoàn một phần', '#ef4444']
  };
  const REFUND_STATUS = { requested: ['Chờ duyệt', '#f59e0b'], approved: ['Đã duyệt', '#10b981'], processed: ['Đã hoàn tiền', '#10b981'], rejected: ['Từ chối', '#ef4444'] };
  const TICKET_STATUS = { open: ['Đang mở', '#f59e0b'], in_progress: ['Đang xử lý', '#60a5fa'], resolved: ['Đã giải quyết', '#10b981'], closed: ['Đã đóng', '#9ca3af'] };
  const pill = (map, key) => { const [t, c] = map[key] || [key, '#a78bba']; return h('span', { class: 'pill', style: `color:${c};border-color:${c}` }, t); };

  // Sinh ma Key ban quyen 5GUYS DRM Safe dong bo 100% voi Kho game cua khach hang
  function hash32(s) {
    let hVal = 2166136261;
    for (let i = 0; i < s.length; i++) { hVal ^= s.charCodeAt(i); hVal = Math.imul(hVal, 16777619) >>> 0; }
    return hVal >>> 0;
  }
  function rng(seed) {
    let x = seed || 1;
    return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  }
  function baseSlug(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').replace(/-(digital|physical)$/, ''); }
  function makeLicenseKey(title, slug, userSeed) {
    const clean = String(title || 'GAME').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
    const part = clean.includes(':') ? clean.split(':').slice(1).join(' ') : clean;
    const words = part.replace(/[^A-Z0-9 ]/g, ' ').trim().split(/\s+/).filter(w => w.length > 2 && !/^[IVX]+$/.test(w));
    let tag = (words[0] || 'GAME').slice(0, 4); while (tag.length < 4) tag += 'X';
    const r = rng(hash32(String(userSeed || 'guest') + '|' + baseSlug(slug || title)));
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let digits = '', tail = '';
    for (let i = 0; i < 4; i++) digits += Math.floor(r() * 10);
    for (let i = 0; i < 4; i++) tail += A[Math.floor(r() * A.length)];
    return `5GUYS-${tag}-${digits}-${tail}`;
  }

  // Du lieu 2 Ticket mau du phong (dong bo giua tab Ho tro va tab Tong quan neu DB chua seed)
  const FALLBACK_TICKETS_KEY = '5guys_admin_sample_tickets_v2';
  function getFallbackTickets() {
    try {
      const saved = JSON.parse(localStorage.getItem(FALLBACK_TICKETS_KEY) || 'null');
      if (Array.isArray(saved) && saved.length) return saved;
    } catch {}
    const init = [
      {
        id: 101,
        subject: 'Lỗi kích hoạt Key game số Hollow Knight: Silksong',
        email: 'minhkhoi.gamer@gmail.com',
        order_number: 'G5-SILK-8829',
        message: 'Chào shop 5GUYS, mình vừa thanh toán bản kỹ thuật số Hollow Knight: Silksong nhưng khi nhập mã Key 5GUYS-SILK-8829-X9A1 vào trình kích hoạt DRM Safe thì báo lỗi chưa đồng bộ máy chủ. Nhờ Admin kiểm tra và kích hoạt lại Key giúp mình nhé!',
        status: 'open',
        priority: 'high',
        created_at: new Date(Date.now() - 2 * 3600 * 1000).toISOString(),
        last_reply: ''
      },
      {
        id: 102,
        subject: 'Hỗ trợ đổi địa chỉ nhận đĩa PS5 Black Myth: Wukong',
        email: 'hoangnam.ps5@gmail.com',
        order_number: 'G5-WUKO-2409',
        message: 'Shop ơi, mình có đặt mua đĩa vật lý Black Myth: Wukong (bản Blu-ray PS5 nguyên seal). Do tuần này mình chuyển văn phòng nên muốn đổi địa chỉ nhận hàng sang Số 45 Nguyễn Huệ, Phường Bến Nghé, Quận 1, TP.HCM (giao hỏa tốc). Nhờ shop cập nhật giúp trước khi xuất kho ạ!',
        status: 'open',
        priority: 'normal',
        created_at: new Date(Date.now() - 5 * 3600 * 1000).toISOString(),
        last_reply: ''
      }
    ];
    localStorage.setItem(FALLBACK_TICKETS_KEY, JSON.stringify(init));
    return init;
  }

  /* ---------- TONG QUAN ---------- */
  async function overview() {
    const s = await call('/stats');
    // Tinh doanh thu tach bach Ky thuat so va Dia vat ly
    let digRev = Number(s.digitalRevenue || 0), phyRev = Number(s.physicalRevenue || 0);
    if (!digRev && !phyRev && Array.isArray(s.topProducts) && s.topProducts.length) {
      for (const p of s.topProducts) {
        if (p.product_type === 'digital') digRev += Number(p.revenue) || 0;
        else phyRev += Number(p.revenue) || 0;
      }
      const sumTop = digRev + phyRev, totalRev = Number(s.revenue) || 0;
      if (sumTop > 0 && totalRev > 0 && sumTop !== totalRev) {
        digRev = Math.round(totalRev * (digRev / sumTop));
        phyRev = Math.max(0, totalRev - digRev);
      }
    }
    // Dong bo so luong ticket dang mo (ke ca khi dung 2 ticket mau tren trinh duyet)
    let openTicketsCount = Number(s.openTickets || 0);
    try {
      const tkRes = await call('/tickets');
      if (Array.isArray(tkRes.tickets) && tkRes.tickets.length > 0) {
        openTicketsCount = tkRes.tickets.filter(t => t.status === 'open' || t.status === 'in_progress').length;
      } else {
        openTicketsCount = getFallbackTickets().filter(t => t.status === 'open' || t.status === 'in_progress').length;
      }
    } catch {}

    const stat = (icon, label, value, tab, subNode) => h('button', { class: 'card p-5 text-left hover:border-brand-light transition flex flex-col justify-between', onclick: tab ? () => go(tab) : null },
      h('div', {},
        h('div', { class: 'text-outline text-sm flex items-center gap-2' }, h('i', { class: 'fa-solid ' + icon }), label),
        h('div', { class: 'text-2xl font-black mt-2' }, value)),
      subNode || null);

    const revSub = h('div', { class: 'mt-3 pt-2.5 border-t border-white/10 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs' },
      h('span', { class: 'flex items-center gap-1.5 text-on-surface-variant' },
        h('span', { class: 'w-2 h-2 rounded-full inline-block', style: 'background:var(--chart-1)' }),
        'Kỹ thuật số: ', h('b', { class: 'text-white' }, money(digRev))),
      h('span', { class: 'flex items-center gap-1.5 text-on-surface-variant' },
        h('span', { class: 'w-2 h-2 rounded-full inline-block', style: 'background:var(--chart-2)' }),
        'Đĩa vật lý: ', h('b', { class: 'text-white' }, money(phyRev))));

    // Xay dung du 14 ngay lien tuc (nhung ngay khong co don hien cot moc thap kem nhan 0đ)
    const dayMap = new Map();
    for (const d of (s.daily || [])) {
      const k = typeof d.day === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d.day)
        ? d.day.slice(0, 10)
        : new Date(d.day).toLocaleDateString('sv-SE');
      dayMap.set(k, { revenue: Number(d.revenue) || 0, orders: Number(d.orders) || 0 });
    }
    let anchor = new Date();
    for (const k of dayMap.keys()) {
      const dt = new Date(k + 'T00:00:00');
      if (dt > anchor) anchor = dt;
    }
    const days14 = [];
    for (let i = 13; i >= 0; i--) {
      const dt = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() - i);
      const key = dt.toLocaleDateString('sv-SE');
      const hit = dayMap.get(key) || { revenue: 0, orders: 0 };
      const ddmm = String(dt.getDate()).padStart(2, '0') + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      days14.push({ key, ddmm, revenue: hit.revenue, orders: hit.orders });
    }
    const max = Math.max(1, ...days14.map(d => d.revenue));

    view.replaceChildren(
      h('div', { class: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4' },
        stat('fa-sack-dollar', 'Doanh thu (đơn đã thanh toán)', money(s.revenue), 'orders', revSub),
        stat('fa-receipt', 'Đơn đã thanh toán', s.paidOrders, 'orders'),
        stat('fa-rotate-left', 'Hoàn tiền chờ duyệt', s.pendingRefunds, 'refunds'),
        stat('fa-headset', 'Ticket hỗ trợ đang mở', openTicketsCount, 'tickets'),
        stat('fa-users', 'Người dùng', s.users, 'users'),
        stat('fa-gamepad', 'Sản phẩm đang bán', s.products, 'products')),
      h('div', { class: 'grid lg:grid-cols-2 gap-4 mt-4' },
        h('div', { class: 'card p-5' },
          h('div', { class: 'flex flex-wrap items-center justify-between gap-2 mb-4' },
            h('h3', { class: 'font-bold' }, 'Doanh thu 14 ngày gần nhất'),
            h('span', { class: 'text-xs text-outline' }, 'Rê chuột hoặc xem nhãn trên đầu cột')),
          h('div', { class: 'scroll pb-1' },
            h('div', { class: 'grid grid-cols-14 items-end gap-1.5 h-52 pt-8 min-w-[560px]', style: 'display:grid;grid-template-columns:repeat(14,minmax(36px,1fr))' },
              days14.map((d, idx) => {
                const hasRev = d.revenue > 0;
                const prevHasRev = idx > 0 && days14[idx - 1].revenue > 0;
                const pct = hasRev ? Math.max(18, Math.round(d.revenue / max * 100)) : 5;
                const tip = `Ngày ${d.ddmm}: ${money(d.revenue)} (${d.orders} đơn)`;
                return h('div', { class: 'group relative flex flex-col items-center justify-end h-full cursor-pointer', title: tip },
                  // Tooltip chi tiet khi hover
                  h('div', { class: 'pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity absolute -top-7 left-1/2 -translate-x-1/2 z-20 whitespace-nowrap rounded-lg bg-[#0d0914] border border-brand-light px-2.5 py-1 text-[11px] font-bold text-white shadow-xl' },
                    `${d.ddmm}: ${money(d.revenue)} · ${d.orders} đơn`),
                  // Nhan so tien tren dau cot (sole nhe neu 2 ngay lien tiep deu co doanh thu de khong de chu)
                  h('span', {
                    class: hasRev
                      ? `text-[10px] font-extrabold text-brand-light bg-[#12091c]/95 border border-brand/50 rounded px-1 py-0.5 whitespace-nowrap z-10 shadow ${prevHasRev ? 'mb-4' : 'mb-1'}`
                      : 'text-[10px] text-outline/70 mb-1 whitespace-nowrap'
                  }, hasRev ? money(d.revenue) : '0đ'),
                  // Cot bieu do (OKLCH phang sach, dong deu do sang)
                  h('div', {
                    class: hasRev
                      ? 'w-full rounded-t group-hover:brightness-110 transition-all'
                      : 'w-full rounded-t bg-white/10 border border-white/15 group-hover:bg-white/20 transition-all',
                    style: hasRev ? `height:${pct}%;background:var(--chart-1)` : `height:${pct}%`
                  }),
                  // Nhan ngay DD-MM
                  h('span', { class: `text-[10px] mt-1.5 whitespace-nowrap ${hasRev ? 'font-bold text-white' : 'text-outline'}` }, d.ddmm)
                );
              })
            )
          )
        ),
        h('div', { class: 'card p-5' }, h('h3', { class: 'font-bold mb-3' }, 'Bán chạy nhất'),
          s.topProducts.length ? h('table', { class: 'w-full' }, h('tbody', {}, s.topProducts.map(p => h('tr', {},
            h('td', {}, p.title, ' ', h('span', { class: 'text-outline text-xs' }, p.product_type === 'digital' ? '(số)' : '(đĩa)')),
            h('td', { class: 'text-right whitespace-nowrap' }, p.sold + ' bản'), h('td', { class: 'text-right font-semibold whitespace-nowrap' }, money(p.revenue))))))
            : h('p', { class: 'text-outline text-sm' }, 'Chưa có dữ liệu.'),
          h('h3', { class: 'font-bold mt-5 mb-2' }, 'Sắp hết hàng (đĩa)'),
          s.lowStock.length ? h('ul', { class: 'text-sm space-y-1' }, s.lowStock.map(p => h('li', { class: 'flex justify-between' }, h('span', {}, p.title + ' · ' + p.platform), h('span', { class: 'text-amber-300' }, 'còn ' + p.available))))
            : h('p', { class: 'text-outline text-sm' }, 'Tồn kho ổn định.')))
    );
  }

  /* ---------- MODAL CHI TIET DON HANG / IN DON / KIEM TRA KEY ---------- */
  function parseItemsFallback(o) {
    return String(o.items || '').split(';').map(s => s.trim()).filter(Boolean).map(raw => {
      const m = raw.match(/^(.*?)\s*\((số|đĩa)\)\s*x(\d+)$/i);
      if (!m) return { product_title: raw, product_type: 'digital', quantity: 1, unit_price: o.total, line_total: o.total };
      return {
        product_title: m[1].trim(),
        product_type: m[2].toLowerCase() === 'đĩa' ? 'physical' : 'digital',
        quantity: Number(m[3]) || 1,
        unit_price: 0,
        line_total: 0
      };
    });
  }

  async function openOrderModal(o, isPhysicalOrder) {
    let detail = { order: o, items: [] };
    try {
      detail = await call('/orders/' + o.id);
    } catch {
      detail = { order: o, items: parseItemsFallback(o) };
    }
    const ord = detail.order || o;
    const items = (detail.items && detail.items.length) ? detail.items : parseItemsFallback(o);
    const userSeed = ord.user_id || ord.email || 'guest';
    const addr = ord.shipping_address;
    const addrText = addr ? [addr.addressLine, addr.ward, addr.district, addr.city].filter(Boolean).join(', ') : '';
    const shipMethodLabel = addr && addr.shippingMethod === 'express' ? 'Giao hỏa tốc (60.000đ)' : 'Giao tiêu chuẩn (30.000đ)';

    const existing = document.getElementById('admin-order-modal');
    if (existing) existing.remove();

    const closeModal = () => overlay.remove();
    const overlay = h('div', {
      id: 'admin-order-modal',
      class: 'fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4',
      onclick: e => { if (e.target === overlay) closeModal(); }
    },
      h('div', { class: 'card w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl border border-brand/50' },
        h('div', { class: 'flex items-start justify-between gap-4 border-b border-white/10 pb-4' },
          h('div', {},
            h('span', { class: 'text-xs font-bold uppercase tracking-wider text-brand-light' }, isPhysicalOrder ? 'PHIẾU ĐIỀU PHỐI & GIAO VẬN ĐĨA VẬT LÝ' : 'CHI TIẾT ĐƠN HÀNG & MÃ BẢN QUYỀN SỐ'),
            h('h3', { class: 'text-xl font-black mt-1' }, 'Đơn hàng #' + ord.order_number),
            h('p', { class: 'text-xs text-outline mt-0.5' }, 'Ngày đặt: ' + date(ord.placed_at) + (ord.paid_at ? ' · Thanh toán: ' + date(ord.paid_at) : ''))),
          h('button', { class: 'ghost no-print !px-2.5 !py-1.5', onclick: closeModal, title: 'Đóng' }, h('i', { class: 'fa-solid fa-xmark' }))),

        // Thong tin khach hang & trang thai
        h('div', { class: 'grid sm:grid-cols-2 gap-4 my-4 text-sm bg-[#12091c] p-4 rounded-xl border border-white/10' },
          h('div', {},
            h('p', { class: 'text-xs text-outline uppercase font-semibold' }, 'Khách hàng'),
            h('p', { class: 'font-bold mt-1' }, ord.display_name || 'Khách hàng'),
            h('p', { class: 'text-xs text-outline' }, ord.email || '')),
          h('div', {},
            h('p', { class: 'text-xs text-outline uppercase font-semibold' }, 'Trạng thái đơn'),
            h('div', { class: 'flex flex-wrap gap-1.5 mt-1' },
              pill(ORDER_STATUS, ord.status),
              ord.refund_status ? pill(REFUND_STATUS, ord.refund_status) : null))),

        // Khung dia chi giao van neu co san pham dia

  /* ---------- DON HANG ---------- */
  let orderFilter = '';
  async function orders() {
    const { orders: list } = await call('/orders' + (orderFilter ? '?status=' + orderFilter : ''));
    const act = (o) => {
      const isPhysical = Number(o.physical_count) > 0 || String(o.items || '').includes('(đĩa)');
      const controls = [];

      if (isPhysical) {
        // Dropdown cap nhat trang thai giao van cho don hang Dia vat ly: Cho lay hang -> Dang giao -> Da giao
        const canShip = ['paid', 'processing', 'shipped', 'fulfilled'].includes(o.status);

          const curVal = (o.status === 'paid' || o.status === 'processing') ? 'processing' : o.status;
          const shipSelect = h('select', {
            class: 'inp !w-auto !py-1 !px-2 text-xs font-semibold',
            title: 'Cập nhật trạng thái giao vận đĩa vật lý',

              const nextStatus = e.target.value;

              orders();

            if (!confirm('Hủy đơn ' + o.order_number + '?')) return;

          } }, 'Hủy đơn'));
        }
        controls.push(h('button', {
          class: 'ghost !py-1 !px-2.5 text-xs whitespace-nowrap',
          onclick: () => openOrderModal(o, true)
        }, h('i', { class: 'fa-solid fa-print text-brand-light' }), 'Chi tiết / In đơn'));
      } else {
        // Don hang Ky thuat so: Nut Xem chi tiet de kiem tra ma Key da cap cho khach
        if (o.status === 'pending_payment') {
          controls.push(h('button', { class: 'ghost danger !py-1 !px-2.5 text-xs', onclick: async () => {
            if (!confirm('Hủy đơn ' + o.order_number + '?')) return;

          class: 'ghost !py-1 !px-2.5 text-xs whitespace-nowrap',
          onclick: () => openOrderModal(o, false)

    const filter = h('select', { class: 'inp !w-auto', onchange: e => { orderFilter = e.target.value; orders(); } },
      h('option', { value: '' }, 'Tất cả trạng thái'), Object.entries(ORDER_STATUS).map(([k, [t]]) => h('option', { value: k, selected: k === orderFilter }, t)));
    view.replaceChildren(h('div', { class: 'card p-5' },

          h('td', { class: 'whitespace-nowrap' }, act(o)))))))
        : h('p', { class: 'text-outline text-sm' }, 'Không có đơn hàng.')));
  }

  /* ---------- HOAN TIEN ---------- */
  async function refunds() {
    const { refunds: list } = await call('/refunds');
    const handle = async (r, action) => {
      if (action === 'approve' && !confirm(`Duyệt hoàn ${money(r.amount)} cho đơn ${r.order_number}? Game số sẽ bị thu hồi khỏi Kho game.`)) return;

        h('thead', {}, h('tr', {}, ['Đơn', 'Khách hàng', 'Số tiền', 'Lý do', 'Trạng thái', 'Ngày gửi', 'Thao tác'].map(t => h('th', {}, t)))),

          h('td', { class: 'whitespace-nowrap' }, pill(REFUND_STATUS, r.status)),
          h('td', { class: 'text-xs whitespace-nowrap' }, date(r.created_at)),
          h('td', { class: 'whitespace-nowrap' }, r.status === 'requested' ? h('div', { class: 'flex items-center gap-1.5' },
            h('button', { class: 'btn !py-1 !px-2.5 text-xs', disabled: !isStrictAdmin(), title: !isStrictAdmin() ? 'Chỉ Quản trị viên (Admin) mới có quyền duyệt hoàn tiền' : '', onclick: () => handle(r, 'approve') }, 'Duyệt'),
            h('button', { class: 'ghost danger !py-1 !px-2.5 text-xs', disabled: !isStrictAdmin(), title: !isStrictAdmin() ? 'Chỉ Quản trị viên (Admin) mới có quyền từ chối hoàn tiền' : '', onclick: () => handle(r, 'reject') }, 'Từ chối')) : h('span', { class: 'text-outline text-xs' }, '—')))))))
        : h('p', { class: 'text-outline text-sm' }, 'Chưa có yêu cầu hoàn tiền.')));
  }

  /* ---------- SAN PHAM ---------- */
  let editing = null, productTypeFilter = 'all';
  async function products() {
    const { products: list } = await call('/products');
    const f = {}, wraps = {};
    const field = (name, label, attrs) => {
      const labelSpan = h('span', {}, label);
      const input = f[name] = h(attrs && attrs.tag || 'input', Object.assign({ class: 'inp', name }, attrs || {}));
      const w = wraps[name] = h('label', { class: 'text-xs text-outline flex flex-col gap-1' }, labelSpan, input);
      w._labelSpan = labelSpan;
      return w;
    };
    const form = h('form', { class: 'card p-5 mb-4 grid sm:grid-cols-2 lg:grid-cols-4 gap-3', onsubmit: save },
      h('h3', { class: 'font-bold sm:col-span-2 lg:col-span-4' }, editing ? 'Sửa: ' + editing.title + (editing.product_type === 'digital' ? ' (số)' : ' (đĩa)') : 'Thêm sản phẩm mới'),
      field('title', 'Tên game *', { required: true }), field('slug', 'Slug (a-z, 0-9, -) *', { required: true, pattern: '[a-z0-9-]+' }),
      field('platform', 'Nền tảng *', { required: true, placeholder: 'PC / PlayStation 5' }), field('genre', 'Thể loại'),
      field('price', 'Giá bán (đ) *', { type: 'number', min: 0, required: true }), field('original_price', 'Giá gốc (đ)', { type: 'number', min: 0 }),
      field('product_type', 'Loại *', { tag: 'select' }), field('stock', 'Tồn kho (đĩa)', { type: 'number', min: 0 }),
      field('min_requirements', 'Cấu hình tối thiểu (Bản số)', { placeholder: 'VD: Windows 10 64-bit, Core i5, RAM 8GB, GTX 1060, SSD 20GB' }),
      field('physical_specs', 'Trọng lượng / Phụ kiện đi kèm (Bản đĩa)', { placeholder: 'VD: 180g • Hộp Blu-ray PS5 nguyên seal, kèm bìa lót & booklet' }),
      field('publisher', 'Nhà phát hành'), field('developer', 'Nhà phát triển'),
      field('cover_url', 'Link ảnh bìa'), field('status', 'Trạng thái', { tag: 'select' }),
      h('label', { class: 'text-xs text-outline flex flex-col gap-1 sm:col-span-2 lg:col-span-4' }, 'Mô tả', f.description = h('textarea', { class: 'inp', rows: 2 })),
      h('div', { class: 'flex gap-2 sm:col-span-2 lg:col-span-4' }, h('button', { class: 'btn', type: 'submit' }, editing ? 'Lưu thay đổi' : 'Thêm sản phẩm'),
        editing ? h('button', { class: 'ghost', type: 'button', onclick: () => { editing = null; products(); } }, 'Hủy sửa') : null));

    f.product_type.append(h('option', { value: 'digital' }, 'Kỹ thuật số'), h('option', { value: 'physical' }, 'Vật lý (Đĩa)'));
    f.status.append(h('option', { value: 'active' }, 'Đang bán'), h('option', { value: 'inactive' }, 'Ẩn'), h('option', { value: 'draft' }, 'Nháp'));

    // Dong bo trang thai form Hybrid theo Loai san pham (Ky thuat so vs Vat ly)
    function syncHybridFields() {
      const isPhys = f.product_type.value === 'physical';
      if (isPhys) {
        f.stock.disabled = false;
        f.stock.required = true;
        f.stock.placeholder = 'Nhập số lượng đĩa tồn kho...';
        if (f.stock.value === '' && !editing) f.stock.value = '25';
        wraps.stock._labelSpan.textContent = 'Tồn kho (đĩa) *';
        wraps.min_requirements.classList.add('hidden');
        f.min_requirements.disabled = true;
        wraps.physical_specs.classList.remove('hidden');
        f.physical_specs.disabled = false;
      } else {
        f.stock.value = '';
        f.stock.disabled = true;
        f.stock.required = false;
        f.stock.placeholder = '∞ (Bản số không giới hạn)';
        wraps.stock._labelSpan.textContent = 'Tồn kho (đĩa) — ∞';
        wraps.min_requirements.classList.remove('hidden');
        f.min_requirements.disabled = false;
        wraps.physical_specs.classList.add('hidden');
        f.physical_specs.disabled = true;
      }
    }
    f.product_type.addEventListener('change', syncHybridFields);

    if (editing) {
      for (const k of ['title', 'slug', 'platform', 'genre', 'price', 'original_price', 'product_type', 'publisher', 'developer', 'cover_url', 'status', 'description']) f[k].value = editing[k] ?? '';
      f.stock.value = editing.quantity_on_hand ?? '';
      if (editing.minimum_requirements) {
        const mr = typeof editing.minimum_requirements === 'string' ? JSON.parse(editing.minimum_requirements) : editing.minimum_requirements;
        f.min_requirements.value = Object.entries(mr || {}).map(([k, v]) => `${k}: ${v}`).join(' · ');
      }
      f.slug.disabled = true; f.product_type.disabled = true;
    }
    syncHybridFields();

    async function save(e) {
      e.preventDefault();
      const body = {};
      const clearableInEdit = new Set(['genre', 'publisher', 'developer', 'cover_url', 'description']);
      for (const k of ['title', 'slug', 'platform', 'genre', 'price', 'original_price', 'product_type', 'publisher', 'developer', 'cover_url', 'status', 'description', 'stock', 'min_requirements', 'physical_specs']) {
        if (f[k].disabled) continue;
        if (f[k].value === '' && !(editing && clearableInEdit.has(k))) continue;
        body[k] = f[k].value;
      }
      if (editing) await call('/products/' + editing.id, 'PUT', body); else await call('/products', 'POST', body);
      flash(editing ? 'Đã lưu ' + body.title : 'Đã thêm ' + body.title); editing = null; products();

    function openRejectModal(p) {
      const existing = document.getElementById('admin-reject-modal');
      if (existing) existing.remove();
      const reasonInput = h('textarea', {
        class: 'inp mt-2',
        rows: 3,
        maxlength: 500,
        placeholder: 'Nhập lý do từ chối để Nhà phát hành chỉnh sửa lại (VD: Ảnh bìa chưa đúng chuẩn, thiếu thông số cấu hình)...'
      });
      const closeModal = () => overlay.remove();
      const submitReject = async (e) => {
        e.preventDefault();
        const reason = reasonInput.value.trim();
        await call('/products/' + p.id + '/approval', 'PUT', { action: 'reject', reason: reason || undefined });

        flash('Đã từ chối sản phẩm "' + p.title + '"');

      };

        onclick: e => { if (e.target === overlay) closeModal(); }
      },
        h('form', { class: 'card w-full max-w-md p-6 border border-red-500/40 shadow-2xl', onsubmit: submitReject },
          h('div', { class: 'flex items-start justify-between gap-3' },
            h('div', {},
              h('span', { class: 'text-xs font-bold uppercase tracking-wider text-red-400' }, 'Từ chối kiểm duyệt game'),
              h('h3', { class: 'text-lg font-black mt-1' }, p.title)),
            h('button', { type: 'button', class: 'ghost !px-2.5 !py-1', onclick: closeModal }, h('i', { class: 'fa-solid fa-xmark' }))),
          h('label', { class: 'block text-xs text-outline mt-4' }, 'Lý do từ chối (tối đa 500 ký tự)', reasonInput),
          h('div', { class: 'flex justify-end gap-2 mt-4' },
            h('button', { type: 'button', class: 'ghost', onclick: closeModal }, 'Hủy'),
            h('button', { type: 'submit', class: 'btn !bg-red-600 hover:!bg-red-500 !border-red-400/40' }, h('i', { class: 'fa-solid fa-ban' }), 'Xác nhận từ chối')))
      );
      document.body.appendChild(overlay);
      reasonInput.focus();
    }

    let q = '';
    const digitalCount = list.filter(p => p.product_type === 'digital').length;
    const physicalCount = list.filter(p => p.product_type === 'physical').length;
    const draftCount = list.filter(p => p.status === 'draft').length;
    const tbody = h('tbody');
    const filterWrap = h('div', { class: 'flex flex-wrap items-center gap-1.5' });

    const renderFilters = () => {
      const opts = [
        ['all', `Tất cả (${list.length})`],
        ['digital', `Bản Số (${digitalCount})`],
        ['physical', `Bản Đĩa (${physicalCount})`],
        ['draft', `Chờ duyệt (${draftCount})`]
      ];
      filterWrap.replaceChildren(...opts.map(([val, label]) =>
        h('button', {
          type: 'button',
          class: 'ghost !py-1.5 !px-3 text-xs ' + (productTypeFilter === val ? 'active-filter' : (val === 'draft' && draftCount > 0 ? '!border-amber-500/60 !text-amber-300' : '')),

    const draw = () => tbody.replaceChildren(...list
      .filter(p => (productTypeFilter === 'all' || (productTypeFilter === 'draft' ? p.status === 'draft' : p.product_type === productTypeFilter)) && (!q || p.title.toLowerCase().includes(q)))
      .map(p => h('tr', {},
        h('td', {},
          p.title,
          h('div', { class: 'text-xs text-outline' }, p.platform + (p.publisher_name ? ' · Studio: ' + p.publisher_name : '')),
          p.status === 'inactive' && p.rejection_reason ? h('div', { class: 'text-xs text-red-300 mt-1 max-w-xs whitespace-normal' }, 'Lý do từ chối: ' + p.rejection_reason) : null),
        h('td', {}, h('span', { class: 'pill', style: p.product_type === 'digital' ? 'color:#c77dff;border-color:#c77dff' : 'color:#60a5fa;border-color:#60a5fa' }, p.product_type === 'digital' ? 'SỐ' : 'ĐĨA')),
        h('td', { class: 'whitespace-nowrap' }, money(p.price), Number(p.discount_percent) ? h('span', { class: 'text-xs text-emerald-300 ml-1' }, '-' + p.discount_percent + '%') : null),

          p.status === 'draft'
            ? h('span', { class: 'pill', style: 'color:#fbbf24;border-color:#f59e0b;background:rgba(245,158,11,0.16)' }, h('i', { class: 'fa-solid fa-clock mr-1' }), 'Chờ duyệt')
            : p.status === 'active'
              ? h('span', { class: 'pill', style: 'color:#10b981;border-color:#10b981' }, 'Đang bán')
              : h('span', { class: 'pill', style: p.rejection_reason ? 'color:#f87171;border-color:#ef4444' : 'color:#9ca3af;border-color:#9ca3af' }, p.rejection_reason ? 'Từ chối' : 'Ẩn')),
        h('td', { class: 'whitespace-nowrap' }, h('div', { class: 'flex flex-wrap gap-1.5' },
          p.status === 'draft' ? [
            h('button', {
              class: 'btn !py-1 !px-2.5 text-xs !bg-emerald-600 hover:!bg-emerald-500 !border-emerald-400/40',
              disabled: !isStrictAdmin(),
              title: !isStrictAdmin() ? 'Chỉ Quản trị viên (Admin) mới có quyền duyệt sản phẩm' : '',
              onclick: async () => {
                await call('/products/' + p.id + '/approval', 'PUT', { action: 'approve' });
                flash('Đã duyệt "' + p.title + '" lên kệ bán!');
                products();
              }
            }, h('i', { class: 'fa-solid fa-check' }), 'Duyệt lên kệ'),
            h('button', {
              class: 'ghost danger !py-1 !px-2.5 text-xs',
              disabled: !isStrictAdmin(),
              title: !isStrictAdmin() ? 'Chỉ Quản trị viên (Admin) mới có quyền từ chối sản phẩm' : '',
              onclick: () => openRejectModal(p)
            }, h('i', { class: 'fa-solid fa-xmark' }), 'Từ chối'),
            h('button', { class: 'ghost !py-1 !px-2.5 text-xs', disabled: !isStrictAdmin(), onclick: () => { editing = p; products(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'Sửa')
          ] : [
            h('button', { class: 'ghost', disabled: !isStrictAdmin(), onclick: () => { editing = p; products(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'Sửa'),
            h('button', { class: 'ghost' + (p.status === 'active' ? ' danger' : ''), disabled: !isStrictAdmin(), onclick: async () => {
              await call('/products/' + p.id, 'PUT', { status: p.status === 'active' ? 'inactive' : 'active' }); flash('Đã cập nhật ' + p.title); products();
            } }, p.status === 'active' ? 'Ẩn' : 'Bán lại')
          ])))));

    renderFilters();
    draw();
    view.replaceChildren(...(isStrictAdmin() ? [form] : []), h('div', { class: 'card p-5' },
      h('div', { class: 'flex flex-wrap justify-between items-center gap-3 mb-4' },
        h('h3', { class: 'font-bold' }, `Sản phẩm (${list.length})`),
        h('div', { class: 'flex flex-wrap items-center gap-2' },
          filterWrap,
          h('input', { class: 'inp w-full sm:!w-60', placeholder: 'Tìm theo tên...', oninput: e => { q = e.target.value.toLowerCase(); draw(); } }))),
      h('div', { class: 'scroll' }, h('table', { style: 'width:100%' }, h('thead', {}, h('tr', {}, ['Tên', 'Loại', 'Giá', 'Tồn kho', 'Trạng thái', 'Thao tác'].map(t => h('th', {}, t)))), tbody))));
  }

  /* ---------- NGUOI DUNG ---------- */
  const ROLE_LABELS = {
    customer: 'Khách hàng',
    publisher: 'Nhà phát hành (Publisher)',
    staff: 'Nhân viên',
    admin: 'Admin'
  };
  async function users() {
    const { users: list } = await call('/users');
    const me = G5.user() || {};
    view.replaceChildren(h('div', { class: 'card p-5' }, h('h3', { class: 'font-bold mb-4' }, `Người dùng (${list.length})`),
      h('div', { class: 'scroll' }, h('table', { style: 'width:100%' },
        h('thead', {}, h('tr', {}, ['Tên', 'Email', 'Vai trò', 'Trạng thái', 'Đơn', 'Điểm', 'Ngày tạo'].map(t => h('th', {}, t)))),
        h('tbody', {}, list.map(u => {
          const self = (me.id != null && String(u.id) === String(me.id))
            || (me.email && String(u.email).toLowerCase() === String(me.email).toLowerCase())
            || (u.role === 'admin' && String(u.email).toLowerCase() === 'admin@5guys.vn' && (!me.email || String(me.email).toLowerCase() === 'admin@5guys.vn'));
          const readOnlyUser = self || !isStrictAdmin();
          const roleSel = h('select', {
            class: 'inp !w-auto',
            disabled: readOnlyUser,
            title: !isStrictAdmin() ? 'Chỉ Quản trị viên (Admin) mới có quyền đổi vai trò' : (self ? 'Tài khoản Admin đang đăng nhập — đã khóa tự đổi vai trò' : 'Đổi vai trò người dùng'),
            onchange: async e => {
              if (readOnlyUser) return;
              await call('/users/' + u.id, 'PUT', { role: e.target.value });
              flash('Đã đổi vai trò ' + u.email + ' thành ' + (ROLE_LABELS[e.target.value] || e.target.value));
            }
          },
            ['customer', 'publisher', 'staff', 'admin'].map(r => h('option', { value: r, selected: r === u.role }, ROLE_LABELS[r])));
          const lock = h('button', {
            class: 'ghost' + (u.status === 'active' ? ' danger' : ''),
            disabled: readOnlyUser,
            title: !isStrictAdmin() ? 'Chỉ Quản trị viên (Admin) mới có quyền khóa/mở khóa tài khoản' : (self ? 'Không thể tự khóa tài khoản Admin đang đăng nhập' : ''),
            onclick: async () => {
              if (readOnlyUser) return;
              await call('/users/' + u.id, 'PUT', { status: u.status === 'active' ? 'locked' : 'active' });
              flash('Đã cập nhật ' + u.email);
              users();
            }
          }, u.status === 'active' ? 'Khóa' : 'Mở khóa');
          return h('tr', {},
            h('td', { class: 'font-medium' }, u.display_name, self ? h('span', { class: 'ml-1.5 text-xs font-bold text-brand-light' }, '(bạn)') : null),
            h('td', { class: 'text-xs' }, u.email),
            h('td', {}, roleSel),
            h('td', {}, lock),
            h('td', {}, u.orders),
            h('td', {}, u.points),
            h('td', { class: 'text-xs whitespace-nowrap' }, date(u.created_at)));
        }))))));
  }

  /* ---------- HO TRO ---------- */
  let expandedTicketId = null;
  async function tickets() {
    const res = await call('/tickets');
    const usingFallback = !Array.isArray(res.tickets) || res.tickets.length === 0;
    const list = usingFallback ? getFallbackTickets() : res.tickets;
    if (expandedTicketId == null && list.length) {
      const firstOpen = list.find(t => t.status === 'open' || t.status === 'in_progress') || list[0];
      expandedTicketId = firstOpen.id;
    }

    const openCount = list.filter(t => t.status === 'open' || t.status === 'in_progress').length;

    const saveTicket = async (t, newStatus, replyText) => {
      if (usingFallback) {
        const cur = getFallbackTickets();
        const item = cur.find(x => x.id === t.id);
        if (item) {
          if (newStatus) item.status = newStatus;
          if (replyText) item.last_reply = replyText;
          localStorage.setItem(FALLBACK_TICKETS_KEY, JSON.stringify(cur));
        }
      } else {
        await call('/tickets/' + t.id, 'PUT', { status: newStatus, reply: replyText || undefined });
      }
    };

    view.replaceChildren(h('div', { class: 'card p-5' },
      h('div', { class: 'flex flex-wrap items-center justify-between gap-2 mb-4' },
        h('div', {},
          h('h3', { class: 'font-bold' }, `Yêu cầu hỗ trợ (${list.length})`),
          h('p', { class: 'text-xs text-outline mt-0.5' }, `Đang mở: ${openCount} ticket · Bấm vào từng ticket để xem nội dung và phản hồi`)),
        h('span', { class: 'pill', style: openCount > 0 ? 'color:#f59e0b;border-color:#f59e0b' : 'color:#10b981;border-color:#10b981' },
          openCount > 0 ? `${openCount} Ticket đang mở` : 'Đã xử lý hết')),
      h('div', { class: 'space-y-3' }, list.map(t => {
        const isOpen = expandedTicketId === t.id;
        const reply = h('textarea', {
          class: 'inp',
          rows: 2,
          placeholder: 'Nhập câu trả lời phản hồi cho khách hàng (VD: Đã kích hoạt lại Key / Đã cập nhật địa chỉ giao hàng mới)...'
        });
        const statusSel = h('select', { class: 'inp !w-auto' },
          Object.entries(TICKET_STATUS).map(([k, [l]]) => h('option', { value: k, selected: k === t.status }, l)));

        return h('div', { class: 'border rounded-xl transition-colors ' + (isOpen ? 'border-brand bg-[#160b25]' : 'border-dark-border bg-[#190d29] hover:border-brand/50') },
          // Header: bam vao de xem / thu gon noi dung ticket
          h('button', {
            type: 'button',
            class: 'w-full text-left p-4 flex flex-wrap items-center justify-between gap-3 cursor-pointer',
            onclick: () => { expandedTicketId = isOpen ? null : t.id; tickets(); }
          },
            h('div', { class: 'min-w-0' },
              h('div', { class: 'flex flex-wrap items-center gap-2' },
                h('b', { class: 'text-sm text-white' }, '#TK-' + String(t.id).padStart(4, '0') + ' · ' + t.subject),
                pill(TICKET_STATUS, t.status)),
              h('p', { class: 'text-xs text-outline mt-1' },
                '👤 ' + (t.email || 'Khách hàng') + ' · 🕒 ' + date(t.created_at) + (t.order_number ? ' · 📦 Đơn ' + t.order_number : ''))),
            h('span', { class: 'text-xs text-brand-light font-semibold flex items-center gap-1' },
              isOpen ? 'Thu gọn' : 'Xem & Phản hồi',
              h('i', { class: 'fa-solid ' + (isOpen ? 'fa-chevron-up' : 'fa-chevron-down') }))),

          // Noi dung chi tiet & o phan hoi
          isOpen ? h('div', { class: 'px-4 pb-4 pt-2 border-t border-white/10 space-y-3' },
            h('div', { class: 'rounded-lg bg-[#12091c] border border-white/10 p-3.5' },
              h('p', { class: 'text-[11px] uppercase tracking-wider text-outline font-bold mb-1' }, 'Nội dung khách gửi:'),
              h('p', { class: 'text-sm text-gray-200 whitespace-pre-line leading-relaxed' }, t.message)),
            t.last_reply ? h('div', { class: 'rounded-lg bg-brand/15 border border-brand/40 p-3 text-sm text-brand-light' },
              h('b', { class: 'text-xs uppercase tracking-wider block mb-1 text-white' }, '✔ Phản hồi của Admin:'),
              t.last_reply) : null,
            h('div', { class: 'space-y-2 pt-1' },
              reply,
              h('div', { class: 'flex flex-wrap items-center justify-between gap-2' },
                h('div', { class: 'flex items-center gap-2' },
                  h('span', { class: 'text-xs text-outline' }, 'Trạng thái:'),
                  statusSel,
                  h('button', {
                    class: 'ghost text-xs',
                    onclick: async () => {
                      await saveTicket(t, statusSel.value, reply.value.trim());
                      flash('Đã lưu cập nhật ticket #TK-' + String(t.id).padStart(4, '0'));
                      tickets();
                    }
                  }, 'Lưu trạng thái')),
                h('button', {
                  class: 'btn',
                  onclick: async () => {
                    const msg = reply.value.trim();
                    if (!msg && !t.last_reply) {
                      flash('Vui lòng nhập nội dung phản hồi cho khách trước khi đóng ticket.', false);
                      reply.focus();
                      return;
                    }
                    await saveTicket(t, 'closed', msg || t.last_reply);
                    flash('Đã gửi phản hồi & đóng ticket #TK-' + String(t.id).padStart(4, '0'));
                    tickets();
                  }
                }, h('i', { class: 'fa-solid fa-paper-plane' }), 'Phản hồi & Đóng ticket')))) : null
        );
      }))));
  }

  const TABS = [
    ['overview', 'fa-chart-line', 'Tổng quan', overview], ['orders', 'fa-receipt', 'Đơn hàng', orders],
    ['refunds', 'fa-rotate-left', 'Hoàn tiền', refunds], ['products', 'fa-gamepad', 'Sản phẩm', products],
    ['users', 'fa-users', 'Người dùng', users], ['tickets', 'fa-headset', 'Hỗ trợ', tickets]
  ];
  function go(id) {
    const tab = TABS.find(t => t[0] === id) || TABS[0];
    location.hash = tab[0];
    document.getElementById('tabs').replaceChildren(...TABS.map(t => h('button', { class: 'tab' + (t[0] === tab[0] ? ' on' : ''), 'data-id': t[0], onclick: () => go(t[0]) }, h('i', { class: 'fa-solid ' + t[1] + ' mr-1' }), t[2])));
    view.replaceChildren(h('p', { class: 'text-outline' }, 'Đang tải...'));
    tab[3]().catch(() => view.replaceChildren(h('p', { class: 'text-red-300' }, 'Không tải được dữ liệu. Kiểm tra backend và quyền admin.')));
  }

  document.addEventListener('DOMContentLoaded', async () => {
    if (!G5.isApiMode()) { document.getElementById('denied').classList.remove('hidden'); return; }
    try { await G5.api('/admin/stats'); }
    catch (err) { document.getElementById('denied').classList.remove('hidden'); return; }
    document.getElementById('app').classList.remove('hidden');
    go(location.hash.slice(1) || 'overview');
    window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && !document.querySelector('#tabs .on')?.dataset.id?.includes(id)) go(id); });
  });
})();
</script>
</body>
</html>
