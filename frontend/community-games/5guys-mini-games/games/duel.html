<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rút Dao Đúng Lúc (10s Duel)</title>
    <style>
        body { background: #2c1e16; color: #f4e4c1; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; user-select: none; }
        .back { position: absolute; top: 20px; left: 20px; color: #f4e4c1; text-decoration: none; font-weight: bold; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 8px; }
        .arena { display: flex; justify-content: space-around; align-items: center; width: 80%; max-width: 700px; height: 220px; background: #4a3222; border: 4px solid #8b5a2b; border-radius: 15px; margin: 20px 0; position: relative; }
        .fighter { font-size: 5rem; transition: transform 0.1s; text-align: center; }
        .fighter span { display: block; font-size: 1rem; margin-top: 5px; font-weight: bold; }
        #signal { font-size: 3rem; font-weight: 900; padding: 15px 30px; border-radius: 10px; background: #1a110b; color: #ffcc00; min-width: 260px; text-align: center; }
        .fire { background: #e94560 !important; color: #fff !important; transform: scale(1.1); }
        button { padding: 15px 35px; font-size: 1.2rem; font-weight: bold; background: #d97706; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #b45309; }
        #info { margin-top: 15px; font-size: 1.1rem; color: #d4b886; height: 28px; }
    </style>
</head>
<body>
    <a href="../index.html" class="back">⬅ Trang chủ</a>
    <h1>🤠 RÚT DAO ĐÚNG LÚC</h1>
    <p>Nhấn phím <b>SPACE</b> hoặc <b>CLICK CHUỘT</b> ngay khi chữ <b>BẮN!</b> xuất hiện.</p>

    <div id="signal">SẴN SÀNG...</div>

    <div class="arena" id="arena">
        <div class="fighter" id="p1">🤠<span>BẠN</span></div>
        <div class="fighter" id="cpu">🥷<span>ĐỐI THỦ</span></div>
    </div>

    <div id="info">Bấm "Bắt đầu đấu" để vào ván</div>
    <button id="startBtn" onclick="startGame()">Bắt đầu đấu</button>

    <script>
        let state = 'idle'; // idle, waiting, ready, ended
        let timer = null;
        let cpuTimer = null;
        let startTime = 0;

        const signalEl = document.getElementById('signal');
        const infoEl = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const p1El = document.getElementById('p1');
        const cpuEl = document.getElementById('cpu');

        function startGame() {
            clearTimeout(timer);
            clearTimeout(cpuTimer);
            state = 'waiting';
            startBtn.style.display = 'none';
            signalEl.className = '';
            signalEl.textContent = 'CHỜ TÍN HIỆU...';
            infoEl.textContent = 'Đừng bấm sớm kẻo phạm quy!';
            p1El.innerHTML = '🤠<span>BẠN</span>';
            cpuEl.innerHTML = '🥷<span>ĐỐI THỦ</span>';

            const delay = Math.random() * 3500 + 1500; // 1.5s - 5s
            timer = setTimeout(() => {
                state = 'ready';
                startTime = performance.now();
                signalEl.textContent = '💥 BẮN! 💥';
                signalEl.className = 'fire';

                // CPU reaction time: 260ms - 450ms
                const cpuDelay = Math.random() * 190 + 260;
                cpuTimer = setTimeout(() => {
                    if (state === 'ready') {
                        state = 'ended';
                        p1El.innerHTML = '💀<span>THUA RỒI</span>';
                        cpuEl.innerHTML = '🥷🗡️<span>THẮNG</span>';
                        signalEl.textContent = 'BẠN CHẬM HƠN!';
                        infoEl.textContent = `Đối thủ phản xạ trong ${Math.round(cpuDelay)}ms!`;
                        startBtn.style.display = 'inline-block';
                        startBtn.textContent = 'Đấu lại';
                    }
                }, cpuDelay);
            }, delay);
        }

        function triggerShot() {
            if (state === 'waiting') {
                clearTimeout(timer);
                state = 'ended';
                signalEl.textContent = '❌ PHẠM QUY!';
                p1El.innerHTML = '🤡<span>BẤM SỚM</span>';
                infoEl.textContent = 'Bạn đã rút vũ khí trước khi có hiệu lệnh!';
                startBtn.style.display = 'inline-block';
                startBtn.textContent = 'Đấu lại';
            } else if (state === 'ready') {
                clearTimeout(cpuTimer);
                state = 'ended';
                const reaction = Math.round(performance.now() - startTime);
                p1El.innerHTML = '🤠🗡️<span>THẮNG</span>';
                cpuEl.innerHTML = '💀<span>BỊ HẠ</span>';
                signalEl.textContent = '🏆 CHIẾN THẮNG!';
                infoEl.textContent = `Tốc độ phản xạ của bạn: ${reaction}ms!`;
                startBtn.style.display = 'inline-block';
                startBtn.textContent = 'Đấu tiếp';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerShot();
            }
        });
        document.getElementById('arena').addEventListener('mousedown', triggerShot);
    </script>
</body>
</html>
