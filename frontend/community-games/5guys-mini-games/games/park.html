<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đỗ Xe Bão Táp (1-Turn Park)</title>
    <style>
        body { background: #1e272e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; user-select: none; }
        .back { position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px; }
        canvas { background: #2f3640; border: 4px solid #7f8fa6; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #msg { margin-top: 15px; font-size: 1.2rem; font-weight: bold; height: 30px; color: #fbc531; }
        button { margin-top: 10px; padding: 10px 25px; font-size: 1rem; font-weight: bold; background: #00a8ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <a href="../index.html" class="back">⬅ Trang chủ</a>
    <h1>🚗 ĐỖ XE BÃO TÁP</h1>
    <p>Bấm <b>SPACE</b> hoặc <b>CLICK</b> đúng 1 lần duy nhất để bẻ lái drift vào ô trống màu xanh!</p>
    <canvas id="gameCanvas" width="650" height="350"></canvas>
    <div id="msg">Nhấn SPACE / CLICK để bẻ lái!</div>
    <button onclick="resetGame()">Chơi lại</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const msgEl = document.getElementById('msg');

        let car, state, spotX;

        function resetGame() {
            spotX = Math.floor(Math.random() * 250) + 250; // Random parking spot X
            car = {
                x: 40,
                y: 230,
                w: 56,
                h: 30,
                speed: 6.5,
                vx: 6.5,
                vy: 0,
                angle: 0,
                turned: false
            };
            state = 'driving';
            msgEl.style.color = '#fbc531';
            msgEl.textContent = 'Canh chuẩn và bấm SPACE / CLICK để bẻ lái!';
        }

        function turnCar() {
            if (state === 'driving' && !car.turned) {
                car.turned = true;
                car.vx = 1.2;
                car.vy = -5.5;
                car.angle = -Math.PI / 2;
            }
        }

        function update() {
            if (state === 'driving') {
                car.x += car.vx;
                car.y += car.vy;

                if (car.turned) {
                    car.vx *= 0.92;
                    car.vy *= 0.96;

                    // Stop near parking row
                    if (car.y <= 75) {
                        car.y = 75;
                        state = 'stopped';
                        checkResult();
                    }
                } else if (car.x > canvas.width) {
                    state = 'stopped';
                    msgEl.style.color = '#ff4d4d';
                    msgEl.textContent = '💨 Chạy lố mất rồi! Bấm Chơi lại.';
                }
            }
        }

        function checkResult() {
            const spotCenter = spotX + 35;
            const carCenter = car.x + car.w / 2;
            const diff = Math.abs(spotCenter - carCenter);

            if (diff <= 22) {
                msgEl.style.color = '#2ecc71';
                msgEl.textContent = '🏆 ĐỖ XE HOÀN HẢO! Drift quá đỉnh!';
            } else {
                msgEl.style.color = '#ff4d4d';
                msgEl.textContent = '💥 Đâm trúng xe bên cạnh rồi!';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Road lines
            ctx.strokeStyle = '#718093';
            ctx.setLineDash([20, 15]);
            ctx.beginPath();
            ctx.moveTo(0, 175);
            ctx.lineTo(canvas.width, 175);
            ctx.stroke();
            ctx.setLineDash([]);

            // Parking bay background
            ctx.fillStyle = 'rgba(46, 204, 113, 0.25)';
            ctx.fillRect(spotX, 40, 70, 85);
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 3;
            ctx.strokeRect(spotX, 40, 70, 85);

            // Parked obstacle cars
            ctx.fillStyle = '#7f8fa6';
            ctx.fillRect(spotX - 75, 45, 55, 75);
            ctx.fillRect(spotX + 90, 45, 55, 75);

            // Player Car
            ctx.save();
            ctx.translate(car.x + car.w / 2, car.y + car.h / 2);
            ctx.rotate(car.angle);
            ctx.fillStyle = '#e84118';
            ctx.fillRect(-car.w / 2, -car.h / 2, car.w, car.h);
            // Windshield
            ctx.fillStyle = '#00a8ff';
            ctx.fillRect(5, -car.h / 2 + 4, 12, car.h - 8);
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); turnCar(); }
        });
        canvas.addEventListener('mousedown', turnCar);

        resetGame();
        loop();
    </script>
</body>
</html>
