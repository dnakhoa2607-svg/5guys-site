<!DOCTYPE html><html lang="vi" class="scroll-smooth"><head><title>5GUYS - Quản lý đơn hàng</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/shared.css"><script>window.G5_REQUIRE_AUTH=true</script><script src="assets/shared.js"></script></head>
<body class="antialiased flex flex-col min-h-screen"><script src="assets/layout.js" data-part="nav"></script><main class="flex-grow"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full"><h1 class="text-3xl font-black text-white uppercase tracking-tight border-l-4 border-brand pl-4">Quản lý đơn hàng</h1><p class="text-gray-400 mt-2 mb-8 font-medium">Lịch sử mua, trạng thái xử lý và yêu cầu hoàn tiền</p><div class="flex gap-2 mb-4 flex-wrap" id="tabs"><button class="btn !py-1 !text-xs" onclick="F='Tất cả';R()">Tất cả</button><button class="ghost !py-1 !text-xs" onclick="F='Đã đặt';R()">Đã đặt</button><button class="ghost !py-1 !text-xs" onclick="F='Đang xử lý';R()">Đang xử lý</button><button class="ghost !py-1 !text-xs" onclick="F='Đang giao / Cấp key';R()">Đang giao / Cấp key</button><button class="ghost !py-1 !text-xs" onclick="F='Hoàn tất';R()">Hoàn tất</button></div><div id="ol" class="space-y-4"><div class="card p-8 text-center"><i class="fa-solid fa-box-open text-3xl text-outline"></i><h3 class="font-bold mt-3">Chưa có đơn hàng</h3><p class="text-sm text-outline mt-2">Đơn hàng sẽ xuất hiện ở đây sau khi bạn đặt mua thành công.</p><a href="digital.html" class="btn mt-4">Khám phá game</a></div></div>
<div id="md" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xl grid place-items-center p-4"><div class="card p-6 w-full max-w-md"><h3 class="font-bold text-lg mb-1">Yêu cầu hoàn tiền</h3><p id="mo" class="mono text-xs text-primary-container mb-4"></p><select id="rr" class="inp w-full mb-3 text-sm"><option>Key không hoạt động</option><option>Mua nhầm sản phẩm</option><option>Hàng hư hỏng khi giao</option><option>Lý do khác</option></select><textarea id="rn" rows="3" class="inp w-full text-sm" placeholder="Mô tả chi tiết..."></textarea><div class="flex gap-2 justify-end mt-4"><button id="cx" class="ghost text-sm">Hủy</button><button id="sb" class="btn text-sm">Gửi yêu cầu</button></div></div></div></div></main><script src="assets/layout.js" data-part="footer"></script><script>
const V=n=>Math.round(n*25000).toLocaleString('vi-VN')+'đ';
const L=k=>k==='digital'?'KỸ THUẬT SỐ':'VẬT LÝ';
// Thoat ky tu HTML cho du lieu nguoi dung nhap (dia chi giao hang)
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const S=['Đã đặt','Đang xử lý','Đang giao / Cấp key','Hoàn tất'];
let O=Array.isArray(G5.getOrders())?G5.getOrders():[],F='Tất cả';
const T=['Tất cả',...S];
function R(){
  tabs.innerHTML=T.map(t=>`<button class="${t===F?'btn':'ghost'} !py-1 !text-xs" onclick="F='${t}';R()">${t}</button>`).join('');
  const visibleOrders=O.filter(o=>F==='Tất cả'||S[o[5]]===F);
  if(!visibleOrders.length){
    ol.innerHTML='<div class="card p-8 text-center"><i class="fa-solid fa-box-open text-3xl text-outline"></i><h3 class="font-bold mt-3">'+(O.length?'Không có đơn hàng ở trạng thái này':'Chưa có đơn hàng')+'</h3><p class="text-sm text-outline mt-2">Đơn hàng sẽ xuất hiện ở đây sau khi bạn đặt mua thành công.</p><a href="digital.html" class="btn mt-4">Khám phá game</a></div>';
    return;
  }
  ol.innerHTML=visibleOrders.map(o=>`<div class="card glow p-5"><div class="flex flex-wrap justify-between gap-2"><div><span class="mono text-xs text-outline">${esc(o[0])} · ${esc(o[1])}</span><h3 class="font-semibold">${esc(o[2])} <span class="chip ${o[3]==='digital'?'dg':'ph'}">${L(o[3])}</span></h3></div><span class="mono font-bold text-primary-container">${V(o[4])}</span></div>
  ${o[8]?`<p class="text-xs text-on-surface-variant mt-2 break-words"><i class="fa-solid fa-truck-fast text-brand-light mr-1"></i>Giao tới: ${esc(o[8])}</p>`:''}<div class="flex items-center mt-4">${S.map((status,k)=>`<div class="flex-1 text-center"><div class="h-1.5 rounded-full ${k<=o[5]?'bg-primary-container':'bg-white/10'} mx-1"></div><p class="text-[10px] mt-1 ${k<=o[5]?'text-primary-container':'text-outline'}">${status}</p></div>`).join('')}</div>
  <div class="flex gap-2 mt-4 flex-wrap">${o[3]==='digital'&&o[5]>=1&&!o[6]?`<a href="library.html" class="ghost !py-1 text-xs"><i class="fa-solid fa-gamepad"></i> Xem trong Kho game</a>`:''}${o[6]?`<span class="chip" style="color:#f59e0b;border-color:#f59e0b">${esc(o[6])}</span>`:`<button type="button" class="ghost !py-1 text-xs" data-refund-order="${esc(o[0])}">Yêu cầu hoàn tiền</button>`}</div></div>`).join('');
}
window.op=id=>{mo.textContent=id;md.classList.remove('hidden')};
ol.addEventListener('click',e=>{const btn=e.target.closest&&e.target.closest('[data-refund-order]');if(btn)window.op(btn.getAttribute('data-refund-order'));});
cx.onclick=()=>md.classList.add('hidden');
sb.onclick=async()=>{if(sb.disabled)return;let o=O.find(x=>x[0]===mo.textContent);if(!o)return;
  if(G5.isApiMode()){sb.disabled=true;try{await G5.api('/orders/'+o[7]+'/refund',{method:'POST',body:{reason:rr.value+(rn.value.trim()?': '+rn.value.trim():'')}});md.classList.add('hidden');rn.value='';O=await G5.syncOrders();R();G5.notify('Đã gửi yêu cầu hoàn tiền. Quản trị viên sẽ xử lý.');}catch(err){G5.notify(G5.errorText(err));}finally{sb.disabled=false;}return;}
  O.filter(x=>x[0]===o[0]).forEach(x=>x[6]='Đã gửi yêu cầu hoàn tiền');md.classList.add('hidden');R()};
R();
if(G5.isApiMode())G5.syncOrders().then(rows=>{O=rows;R()}).catch(()=>G5.notify("Không tải được đơn hàng từ API."));</script>

</body></html>
