<!DOCTYPE html><html lang="vi" class="scroll-smooth"><head><title>5GUYS - Đánh giá &amp; Cộng đồng</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<style>body{background:#12091c;color:#f3e8ff;overflow-x:hidden;font-family:Inter,sans-serif}h1,h2,h3,h4{letter-spacing:-.02em}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#12091c}::-webkit-scrollbar-thumb{background:#3c096c;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#9d4edd}
.game-card{transition:transform .3s cubic-bezier(.4,0,.2,1),box-shadow .3s cubic-bezier(.4,0,.2,1)}.game-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 15px 30px -5px rgba(157,78,221,.5),0 0 15px rgba(157,78,221,.3) inset;border-color:#c77dff}
.glow:hover{border-color:#c77dff!important;box-shadow:0 0 20px -4px rgba(157,78,221,.5)}.btn{display:inline-block;text-align:center;background:#9d4edd;color:#fff;font-weight:700;border-radius:.375rem;padding:.6rem 1.25rem;border:1px solid rgba(199,125,255,.3);box-shadow:0 0 15px rgba(157,78,221,.4);transition:.3s}.btn:hover{background:#c77dff;box-shadow:0 0 25px rgba(199,125,255,.6)}
.ghost{background:#12091c;border:1px solid #3c096c;border-radius:.5rem;padding:.5rem 1rem;color:#e9d5ff;transition:.3s}.ghost:hover{border-color:#c77dff;color:#fff}.card{background:#2a1645;border:1px solid #3c096c;border-radius:1rem;transition:.3s}
.inp{background:#12091c!important;border:1px solid #3c096c!important;border-radius:.5rem!important;color:#f3e8ff;padding:.6rem 1rem}.inp:focus{outline:0;box-shadow:0 0 0 2px #c77dff!important}.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip{font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:9999px;padding:2px 10px;border:1px solid}.dg{background:rgba(157,78,221,.2);border-color:rgba(199,125,255,.4);color:#c77dff}.ph{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4);color:#60a5fa}select.inp option{background:#12091c;color:#f3e8ff}</style><link rel="stylesheet" href="assets/shared.css"><script src="assets/shared.js"></script></head>
<body class="antialiased flex flex-col min-h-screen"><script src="assets/layout.js" data-part="nav"></script><main class="flex-grow"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full"><h1 class="text-3xl font-black text-white uppercase tracking-tight border-l-4 border-brand pl-4">Cộng Đồng Đánh Giá 5GUYS</h1><p class="text-gray-400 mt-2 mb-8 font-medium">Đánh giá game từ cộng đồng và Hub thảo luận</p><div class="flex gap-2 mb-6"><button id="t1" class="btn text-sm">Đánh giá</button><button id="t2" class="ghost text-sm">Thảo luận Hub</button></div>
<div id="v1" class="grid lg:grid-cols-3 gap-6"><div class="space-y-6 lg:col-span-1"><div class="card p-5 text-center"><p class="text-5xl font-extrabold text-primary-container" id="avg">4.7</p><p class="text-yellow-400" id="st">★★★★★</p><p class="mono text-xs text-outline mt-1"><span id="rc" class="">3</span> ĐÁNH GIÁ</p></div><div class="card p-5"><h3 class="font-bold mb-3">Viết đánh giá</h3><div id="stars" class="text-2xl text-outline cursor-pointer mb-3"><span onclick="sc=1;S()">★</span><span onclick="sc=2;S()">★</span><span onclick="sc=3;S()">★</span><span onclick="sc=4;S()">★</span><span onclick="sc=5;S()">★</span></div><select id="rgame" class="inp w-full mb-2 text-sm hidden"></select><input id="rt" class="inp w-full mb-2 text-sm" placeholder="Tiêu đề"><textarea id="rb" rows="4" class="inp w-full text-sm" placeholder="Chia sẻ trải nghiệm..."></textarea><p id="rmsg" class="text-xs mt-2 text-outline"></p><button id="rsub" class="btn w-full mt-3 text-sm">Đăng đánh giá</button></div></div><div id="rl" class="lg:col-span-2 space-y-4"></div></div>
<div id="v2" class="hidden space-y-4"><div class="card p-4 flex gap-2"><input id="ft" class="inp flex-1 text-sm" placeholder="Bắt đầu chủ đề mới..."><button id="fb" class="btn text-sm">Đăng</button></div><div id="fl" class="space-y-3"></div></div></div></main><script src="assets/layout.js" data-part="footer"></script><script>
(function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  };
  const starsText = (n) => '★'.repeat(Math.max(0, Math.min(5, Math.round(n)))) + '☆'.repeat(Math.max(0, 5 - Math.round(n)));

  let sc = 5;
  let onlineMode = false;
  let apiReviews = [];
  const demoReviews = [
    { id: null, display_name: 'NovaKnight', rating: 5, title: 'Siêu phẩm!', body: 'Cốt truyện cuốn, đồ họa đỉnh. Key kích hoạt ngay lập tức.', helpful_count: 42, voted: false },
    { id: null, display_name: 'PixelMonk', rating: 4, title: 'Hay nhưng hơi lag', body: 'Chơi tốt trên PC cấu hình cao, bản vá đầu cần tối ưu thêm.', helpful_count: 17, voted: false },
    { id: null, display_name: 'GhostRider', rating: 5, title: 'Đáng tiền', body: 'Bản collector đóng gói cực đẹp.', helpful_count: 9, voted: false },
  ];
  const threads = [
    ['Mẹo build Netrunner mạnh nhất', 'DataWolf', 24, '2 giờ trước'],
    ['Lỗi crash khi vào Night City?', 'KaiZen', 11, '5 giờ trước'],
    ['Tìm đồng đội co-op', 'Lyra', 6, '1 ngày trước'],
  ];

  function renderThreads() {
    $('fl').replaceChildren(...threads.map((t) => {
      const card = el('div', 'card glow p-4 flex justify-between items-center gap-3');
      const left = el('div');
      left.append(el('h4', 'font-semibold', t[0]), el('p', 'text-xs text-outline', `${t[1]} · ${t[3]}`));
      const right = el('span', 'mono text-xs text-secondary');
      const ic = el('i', 'fa-solid fa-message mr-1');
      right.append(ic, document.createTextNode(String(t[2])));
      card.append(left, right);
      return card;
    }));
  }

  function renderReviews(list) {
    const rl = $('rl');
    rl.replaceChildren();
    if (!list.length) {
      rl.appendChild(el('div', 'card p-6 text-center text-sm text-outline', 'Chưa có đánh giá nào được đăng. Hãy chọn game ở cột bên trái để viết đánh giá đầu tiên!'));
      $('avg').textContent = '0.0';
      $('st').textContent = starsText(0);
      $('rc').textContent = '0';
      return;
    }

    const avg = list.reduce((s, r) => s + Number(r.rating || 0), 0) / list.length;
    $('avg').textContent = avg.toFixed(1);
    $('st').textContent = starsText(avg);
    $('rc').textContent = String(list.length);

    list.forEach((review) => {
      const card = el('article', 'card p-5');
      const top = el('div', 'flex flex-wrap items-center justify-between gap-2');
      const authorWrap = el('div', 'flex flex-wrap items-center gap-2');
      authorWrap.appendChild(el('b', 'text-white', review.display_name || 'Game thủ'));
      if (review.verified_purchase) {
        authorWrap.appendChild(el('span', 'text-xs text-emerald-300 font-semibold', '✔ Đã mua'));
      }
      if (review.product_title) {
        const gameLink = el('a', 'chip dg hover:border-brand-light transition-colors', review.product_title);
        gameLink.href = 'detail.html?slug=' + encodeURIComponent(review.product_slug || '');
        authorWrap.appendChild(gameLink);
      }
      top.append(authorWrap, el('span', 'text-yellow-400 text-sm', starsText(review.rating)));
      card.appendChild(top);

      if (review.title) card.appendChild(el('h4', 'font-semibold mt-2 text-white', review.title));
      card.appendChild(el('p', 'text-sm text-on-surface-variant mt-1 whitespace-pre-line', review.body));

      if (review.publisher_reply && String(review.publisher_reply).trim()) {
        const replyBox = el('div', 'mt-3 ml-4 pl-3 border-l-2 border-brand-light bg-[#12091c]/70 rounded-r-xl p-3');
        const head = el('p', 'text-xs font-bold text-brand-light flex items-center gap-1.5');
        head.append(el('i', 'fa-solid fa-code-branch text-[11px]'), document.createTextNode('Phản hồi từ Nhà phát hành'));
        replyBox.append(head, el('p', 'mt-1 text-xs sm:text-sm text-gray-200 whitespace-pre-line', review.publisher_reply));
        card.appendChild(replyBox);
      }

      const voteBtn = el('button', 'text-xs text-outline hover:text-brand-light mt-2 inline-flex items-center gap-1 cursor-pointer transition-colors');
      voteBtn.type = 'button';
      if (review.voted) {
        voteBtn.classList.remove('text-outline');
        voteBtn.classList.add('text-brand-light');
      }
      const countSpan = el('span', '', String(review.helpful_count || 0));
      countSpan.setAttribute('data-helpful-count', '');
      voteBtn.append(document.createTextNode('👍 Hữu ích ('), countSpan, document.createTextNode(')'));

      voteBtn.addEventListener('click', async () => {
        if (onlineMode && review.id) {
          if (!G5.requireLogin('Vui lòng đăng nhập để bình chọn đánh giá hữu ích.')) return;
          if (!G5.isApiMode()) {
            G5.notify('Vui lòng đăng nhập qua API để bình chọn đánh giá.');
            return;
          }
          voteBtn.disabled = true;
          try {
            const res = await G5.api('/products/reviews/' + review.id + '/vote', { method: 'POST' });
            review.helpful_count = Number(res.helpfulCount ?? 0);
            review.voted = !!res.voted;
            countSpan.textContent = String(review.helpful_count);
            voteBtn.classList.toggle('text-brand-light', review.voted);
            voteBtn.classList.toggle('text-outline', !review.voted);
          } catch (err) {
            G5.notify(G5.errorText(err));
          } finally {
            voteBtn.disabled = false;
          }
        } else {
          review.voted = !review.voted;
          review.helpful_count = Math.max(0, Number(review.helpful_count || 0) + (review.voted ? 1 : -1));
          countSpan.textContent = String(review.helpful_count);
          voteBtn.classList.toggle('text-brand-light', review.voted);
          voteBtn.classList.toggle('text-outline', !review.voted);
        }
      });

      card.appendChild(voteBtn);
      rl.appendChild(card);
    });
  }

  window.S = function S() {
    $('stars').replaceChildren(...[1, 2, 3, 4, 5].map((i) => {
      const sp = el('span', '', '★');
      if (i <= sc) sp.style.color = '#facc15';
      sp.onclick = () => { sc = i; S(); };
      return sp;
    }));
  };
  window.S();

  $('rsub').onclick = async () => {
    if (!G5.requireLogin('Vui lòng đăng nhập để gửi đánh giá.')) return;
    const body = $('rb').value.trim();
    const title = $('rt').value.trim();
    const msg = $('rmsg');
    msg.textContent = '';
    if (!sc || body.length < 3) {
      msg.className = 'text-xs mt-2 text-red-400';
      msg.textContent = 'Vui lòng chọn số sao và nhập nội dung tối thiểu 3 ký tự.';
      return;
    }
    if (onlineMode && G5.isApiMode() && $('rgame').value) {
      $('rsub').disabled = true;
      try {
        await G5.api('/products/' + $('rgame').value + '/reviews', {
          method: 'POST',
          body: { rating: sc, title, body },
        });
        $('rt').value = '';
        $('rb').value = '';
        msg.className = 'text-xs mt-2 text-emerald-300';
        msg.textContent = 'Đã đăng đánh giá thành công!';
        const refreshed = await G5.api('/products/reviews');
        apiReviews = refreshed.reviews || [];
        renderReviews(apiReviews);
      } catch (err) {
        msg.className = 'text-xs mt-2 text-red-400';
        msg.textContent = G5.errorText(err);
      } finally {
        $('rsub').disabled = false;
      }
      return;
    }
    const currentUser = G5.user();
    demoReviews.unshift({
      id: null,
      display_name: currentUser && currentUser.name ? currentUser.name : 'Thành viên',
      rating: sc,
      title: title || 'Đánh giá',
      body,
      helpful_count: 0,
      voted: false,
    });
    $('rt').value = '';
    $('rb').value = '';
    sc = 5;
    window.S();
    renderReviews(demoReviews);
  };

  $('fb').onclick = () => {
    if (!G5.requireLogin('Vui lòng đăng nhập để đăng bài cộng đồng.')) return;
    if ($('ft').value.trim()) {
      const currentUser = G5.user();
      threads.unshift([$('ft').value.trim(), currentUser && currentUser.name ? currentUser.name : 'Thành viên', 0, 'Vừa xong']);
      $('ft').value = '';
      renderThreads();
    }
  };

  $('t1').onclick = () => {
    $('v1').classList.remove('hidden');
    $('v2').classList.add('hidden');
    $('t1').className = 'btn text-sm';
    $('t2').className = 'ghost text-sm';
  };
  $('t2').onclick = () => {
    $('v2').classList.remove('hidden');
    $('v1').classList.add('hidden');
    $('t2').className = 'btn text-sm';
    $('t1').className = 'ghost text-sm';
  };

  renderThreads();
  renderReviews(demoReviews);

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const [revRes, prodRes] = await Promise.all([
        G5.api('/products/reviews'),
        G5.api('/products?limit=100'),
      ]);
      onlineMode = true;
      apiReviews = revRes.reviews || [];
      const games = prodRes.products || [];
      if (games.length) {
        const sel = $('rgame');
        sel.replaceChildren(...games.map((g) => el('option', '', `${g.title} (${g.product_type === 'digital' ? 'Số' : 'Đĩa'})`)));
        Array.from(sel.options).forEach((opt, idx) => { opt.value = String(games[idx].id); });
        sel.classList.remove('hidden');
      }
      renderReviews(apiReviews);
    } catch {
      onlineMode = false;
      renderReviews(demoReviews);
    }
  });
})();
</script>
</body></html>
