<!DOCTYPE html><html lang="vi" class="scroll-smooth"><head><title>5GUYS - Tìm kiếm game</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<style>/* CSS riêng cho trang tìm kiếm: nhóm bộ lọc, trạng thái chọn và menu thả xuống. *//* Tiêu đề nhóm lọc có dấu mở/đóng để báo trạng thái accordion. */.search-filter details>summary{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.75rem}.search-filter details>summary::after{content:"";width:.75rem;height:2px;border-radius:2px;background:#c77dff}.search-filter details>summary::before{content:"";position:absolute;right:.32rem;top:50%;width:2px;height:.75rem;border-radius:2px;background:#c77dff;transform:translateY(-50%) scaleY(1);transition:transform .22s ease}.search-filter details[open]>summary::before{transform:translateY(-50%) scaleY(0)}@supports selector(details::details-content){.search-filter details{interpolate-size:allow-keywords}.search-filter details::details-content{block-size:0;overflow:clip;opacity:0;transition:block-size .28s ease,opacity .2s ease,content-visibility .28s allow-discrete}.search-filter details[open]::details-content{block-size:auto;opacity:1}@starting-style{.search-filter details[open]::details-content{block-size:0;opacity:0}}}@media(prefers-reduced-motion:reduce){.search-filter details>summary::before,.search-filter details::details-content{transition-duration:.01ms}}/* Thể loại hiển thị dạng thẻ; checkbox gốc được ẩn nhưng vẫn giữ khả năng truy cập. */.search-filter .cg{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.search-filter label:has(.cg){position:relative;display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid rgba(199,125,255,.32);border-radius:.75rem;background:#12091c;padding:.5rem .75rem;text-align:left;transition:background-color .15s,border-color .15s,color .15s}.search-filter label:has(.cg:checked){border-color:#c77dff;background:#9d4edd;color:#fff}.search-filter label:has(.cg:checked)::after{content:"✓";font-weight:800}.search-filter .cp[aria-pressed="true"]::after{content:"✓";float:right;color:#fff;font-weight:800}.search-filter .cp[aria-pressed="true"]{background:#9d4edd;border-color:#9d4edd;color:#fff}.search-filter .ft[aria-pressed="true"]::after{content:"✓";position:absolute;right:.75rem;color:#fff}.search-filter .ft{position:relative;min-height:2.5rem}.search-filter .ft[aria-pressed="true"]{background:#9d4edd;border-color:#9d4edd;color:#fff}.search-filter .ft[aria-pressed="false"]{background:#12091c;border-color:rgba(199,125,255,.32);color:#f3e8ff}.search-filter .filter-panel{padding-top:.75rem}/* Hai menu tùy chỉnh dùng chung kiểu; menu sắp xếp rộng hơn để giữ chữ trên một dòng. */.page-size-menu[hidden]{display:none}.page-size-menu{position:absolute;right:0;top:calc(100% + .35rem);z-index:60;width:9rem;overflow:hidden;border:1px solid rgba(199,125,255,.35);border-radius:.85rem;background:#2a1645;box-shadow:0 12px 28px rgba(0,0,0,.45);padding:.25rem}.page-size-menu.sort-menu{width:12rem}.page-size-option{white-space:nowrap;display:flex;width:100%;align-items:center;justify-content:space-between;border:0;border-radius:.55rem;background:transparent;padding:.6rem .75rem;text-align:left;color:#e9d5ff;font-weight:600}.page-size-option:hover,.page-size-option:focus-visible{background:rgba(157,78,221,.2);outline:none}.page-size-option[aria-selected="true"]{background:#9d4edd;color:white}.page-size-option[aria-selected="true"]::after{content:"✓";font-weight:800}/* Không chiếm chỗ khi số kết quả chỉ có một trang. */#results-pagination:empty{display:none}body{background:#12091c;color:#f3e8ff;overflow-x:hidden;font-family:Inter,sans-serif}h1,h2,h3,h4{letter-spacing:-.02em}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#12091c}::-webkit-scrollbar-thumb{background:#3c096c;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#9d4edd}.game-card{transition:transform .3s cubic-bezier(.4,0,.2,1),box-shadow .3s cubic-bezier(.4,0,.2,1)}.game-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 15px 30px -5px rgba(157,78,221,.5),0 0 15px rgba(157,78,221,.3) inset;border-color:#c77dff}.glow:hover{border-color:#c77dff!important;box-shadow:0 0 20px -4px rgba(157,78,221,.5)}.btn{display:inline-block;text-align:center;background:#9d4edd;color:#fff;font-weight:700;border-radius:.375rem;padding:.6rem 1.25rem;border:1px solid rgba(199,125,255,.3);box-shadow:0 0 15px rgba(157,78,221,.4);transition:.3s}.btn:hover{background:#c77dff;box-shadow:0 0 25px rgba(199,125,255,.6)}.ghost{background:#12091c;border:1px solid #3c096c;border-radius:.5rem;padding:.5rem 1rem;color:#e9d5ff;transition:.3s}.ghost:hover{border-color:#c77dff;color:#fff}.card{background:#2a1645;border:1px solid #3c096c;border-radius:1rem;transition:.3s}.inp{background:#12091c!important;border:1px solid #3c096c!important;border-radius:.5rem!important;color:#f3e8ff;padding:.6rem 1rem}.inp:focus{outline:0;box-shadow:0 0 0 2px #c77dff!important}.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}.chip{font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:9999px;padding:2px 10px;border:1px solid}.dg{background:rgba(157,78,221,.2);border-color:rgba(199,125,255,.4);color:#c77dff}.ph{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4);color:#60a5fa}</style><link rel="stylesheet" href="assets/shared.css"><script src="assets/shared.js"></script></head>
<body class="antialiased flex flex-col min-h-screen"><!-- Phần 1: Thanh điều hướng chung và liên kết tài khoản. --><script src="assets/layout.js" data-part="nav"></script><!-- Phần 2: Nội dung chính của trang tìm kiếm. --><main class="flex-grow"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full"><h1 class="text-3xl font-black text-white uppercase tracking-tight border-l-4 border-brand pl-4">Tìm kiếm game</h1><p class="text-gray-400 mt-2 mb-8 font-medium">Lọc theo thể loại, nền tảng, giá và định dạng</p><!-- 2.1: Ô nhập từ khóa và nút gửi tìm kiếm. --><form id="game-search-form" role="search" class="flex gap-2 mb-6"><label class="sr-only" for="game-search-input">Tìm tên game</label><input id="game-search-input" class="inp flex-1" type="search" placeholder="Nhập tên game…"><button class="btn" type="submit">Tìm kiếm</button></form><!-- 2.2: Bố cục hai cột gồm bộ lọc và danh sách kết quả. --><div class="grid grid-cols-1 lg:grid-cols-4 gap-6 lg:gap-8"><!-- 2.2.1: Bộ lọc động theo catalog: thể loại, nền tảng, giá và định dạng. --><aside class="search-filter lg:col-span-1 h-fit space-y-6 rounded-2xl border border-brand/40 bg-dark-surface p-5 sm:p-6 lg:sticky lg:top-24" aria-label="Bộ lọc tìm kiếm"><details open class="border-b border-brand/20 pb-4"><!-- Thể loại: checkbox được tạo theo dữ liệu hiện có trong catalog. --><summary class="cursor-pointer list-none text-xs font-bold uppercase tracking-wider text-brand-light">Thể loại</summary><div class="filter-panel"><div id="fg" class="space-y-2 text-sm"></div></div></details><details open class="border-b border-brand/20 pb-4"><!-- Nền tảng: chọn một hoặc nhiều nền tảng để thu hẹp kết quả. --><summary class="cursor-pointer list-none text-xs font-bold uppercase tracking-wider text-brand-light">Nền tảng</summary><div class="filter-panel"><div id="fp" class="flex flex-col gap-2"></div></div></details><!-- Giá tối đa: thanh trượt giới hạn mức giá của game trong kết quả. --><section><div class="mb-3 flex items-center justify-between gap-2"><h2 class="text-xs font-bold uppercase tracking-wider text-brand-light">Giá tối đa</h2><output id="pv" class="text-sm font-bold text-primary-container" for="pr">2.000.000đ</output></div><input id="pr" type="range" min="0" max="2000000" step="50000" value="2000000" class="w-full cursor-pointer accent-purple-500" aria-label="Giá tối đa"></section><details open class="border-b border-brand/20 pb-4"><!-- Định dạng: chuyển giữa tất cả, kỹ thuật số và vật lý. --><summary class="cursor-pointer list-none text-xs font-bold uppercase tracking-wider text-brand-light">Định dạng</summary><div class="filter-panel"><div class="flex flex-col gap-2"><button type="button" data-f="all" aria-pressed="true" class="ft w-full rounded-xl bg-brand px-3 py-2.5 text-left text-sm font-bold text-white transition-colors">Tất cả</button><button type="button" data-f="digital" aria-pressed="false" class="ft w-full rounded-xl border border-brand/40 bg-dark-bg px-3 py-2.5 text-left text-sm font-bold text-gray-200 transition-colors hover:border-brand-light">Kỹ thuật số</button><button type="button" data-f="physical" aria-pressed="false" class="ft w-full rounded-xl border border-brand/40 bg-dark-bg px-3 py-2.5 text-left text-sm font-bold text-gray-200 transition-colors hover:border-brand-light">Vật lý</button></div></div></details><button id="rs" type="button" class="w-full rounded-xl border border-brand/50 bg-dark-bg px-4 py-2.5 text-sm font-semibold text-gray-200 transition-colors hover:border-brand-light hover:text-white">Xóa bộ lọc</button></aside><!-- 2.2.2: Khu vực sắp xếp, chọn số game mỗi trang, lưới game và phân trang. --><section class="lg:col-span-3 min-w-0"><div class="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-dark-border bg-dark-surface px-4 py-3"><p class="text-sm text-outline"><strong id="cnt" class="text-white">0</strong> kết quả</p><div class="flex flex-wrap items-center gap-2"><label class="sr-only" for="sort-trigger">Sắp xếp kết quả</label><!-- Menu sắp xếp theo đánh giá hoặc giá bán; select ẩn lưu giá trị cho JavaScript. --><div id="sort-picker" class="relative"><button id="sort-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" class="inp flex min-w-44 items-center justify-between gap-4 whitespace-nowrap text-sm font-semibold"><span>Đánh giá cao</span><i class="fa-solid fa-chevron-down text-xs text-brand-light transition-transform"></i></button><div id="sort-menu" class="page-size-menu sort-menu" role="listbox" aria-label="Sắp xếp kết quả" hidden><button type="button" class="page-size-option" role="option" data-sort-value="r" aria-selected="true">Đánh giá cao</button><button type="button" class="page-size-option" role="option" data-sort-value="a" aria-selected="false">Giá tăng dần</button><button type="button" class="page-size-option" role="option" data-sort-value="d" aria-selected="false">Giá giảm dần</button></div><select id="so" class="sr-only" tabindex="-1" aria-hidden="true"><option value="r" selected>Đánh giá cao</option><option value="a">Giá tăng dần</option><option value="d">Giá giảm dần</option></select></div><!-- Menu chọn số game mỗi trang; thay đổi sẽ cập nhật phân trang. --><div id="page-size-picker" class="relative"><button id="page-size-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" class="inp flex min-w-36 items-center justify-between gap-4 whitespace-nowrap text-sm font-semibold"><span>View: 20</span><i class="fa-solid fa-chevron-down text-xs text-brand-light transition-transform"></i></button><div id="page-size-menu" class="page-size-menu" role="listbox" aria-label="Số kết quả mỗi trang" hidden><button type="button" class="page-size-option" role="option" data-page-size="5" aria-selected="false">5</button><button type="button" class="page-size-option" role="option" data-page-size="10" aria-selected="false">10</button><button type="button" class="page-size-option" role="option" data-page-size="15" aria-selected="false">15</button><button type="button" class="page-size-option" role="option" data-page-size="20" aria-selected="true">20</button><button type="button" class="page-size-option" role="option" data-page-size="50" aria-selected="false">50</button><button type="button" class="page-size-option" role="option" data-page-size="100" aria-selected="false">100</button></div><select id="page-size" class="sr-only" tabindex="-1" aria-hidden="true"><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select></div></div></div><div id="search-games-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-5"></div><nav id="results-pagination" class="mt-6 flex items-center justify-center gap-2" aria-label="Phân trang kết quả"></nav></section></div></div></main><!-- Phần 3: Footer và các liên kết thông tin của cửa hàng. --><script src="assets/layout.js" data-part="footer"></script><!-- Phần 4: Nạp hàm dựng thẻ game dùng chung rồi chạy logic tìm kiếm. --><script src="assets/catalog.js"></script><script src="assets/search.js"></script>

</body></html>
